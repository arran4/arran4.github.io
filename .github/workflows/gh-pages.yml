name: GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:
  schedule:
    - cron: '5 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.8'
          extended: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Fetch Stars
        id: fetch_stars
        run: |
          sudo apt-get update && sudo apt-get install -y yq jq

          STARS_FILE="data/stars.json"
          echo "{}" > "$STARS_FILE"

          for repo_url in $(yq '.projects[].repo' data/en/sections/projects.yaml | tr -d '"'); do
            if [[ "$repo_url" == "null" ]]; then
              continue
            fi
            repo_path=$(echo "$repo_url" | sed 's|https://github.com/||')

            stars=$(curl -fsSL --retry 3 "https://api.github.com/repos/$repo_path" | jq '.stargazers_count')

            tmpfile=$(mktemp)
            jq --arg repo "$repo_path" --argjson stars "$stars" '.[$repo] = $stars' "$STARS_FILE" > "$tmpfile" && mv "$tmpfile" "$STARS_FILE"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Everything required
        run: |
          export HUGO_CACHEDIR=${{ runner.temp }}/hugo_cache
          mkdir -p ${{ runner.temp }}/hugo_cache
          hugo mod npm pack
          npm install @popperjs/core@2.11.8 include-media@1.4.10 --save-dev --legacy-peer-deps
          npm install --legacy-peer-deps
          sudo rm -rf public/
          export HUGO_CACHEDIR=${{ runner.temp }}/hugo_cache
          mkdir -p $HUGO_CACHEDIR
          chmod -R u+w $HUGO_CACHEDIR
          hugo --minify --templateMetrics
          bash scripts/verify-workbench.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
