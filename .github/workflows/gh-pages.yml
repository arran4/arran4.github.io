name: GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public GitHub metadata snapshots
        type: boolean
        default: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # Explicitly dispatch CI for GITHUB_TOKEN-created snapshot PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test metadata refresher
        run: go test ./cmd/refresh-github-snapshots ./tools/refresh-releases
      - name: Refresh validated public metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/refresh-github-snapshots -page-delay=2s
      - name: Refresh allowlisted public release metadata
        run: go run ./tools/refresh-releases
      - name: Propose changed snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add data/github/repositories.json data/github/starred.json data/stars.json data/releases.json
          if git diff --cached --quiet; then
            echo "No public metadata changes; no PR or rebuild necessary."
            exit 0
          fi

          branch=automation/daily-github-snapshots
          git switch -C "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: refresh public GitHub metadata snapshots'
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title 'chore: daily public GitHub metadata refresh' \
              --body 'Daily, reviewed data-only refresh of full public repositories, starred repositories, star counts and allowlisted public releases. Generated by the bounded Go refresher. Validate additions/removals and merge when appropriate; no site redeploy occurs until the snapshot changes land in main.'
          fi
          # PRs and pushes created with GITHUB_TOKEN do not trigger normal PR CI.
          gh workflow run gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.refresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test metadata refresher
        run: go test ./cmd/refresh-github-snapshots ./tools/refresh-releases

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Everything required
        run: |
          export HUGO_CACHEDIR=${{ runner.temp }}/hugo_cache
          mkdir -p "$HUGO_CACHEDIR"
          rm -rf public/
          hugo --minify --templateMetrics
          bash scripts/verify-workbench.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
