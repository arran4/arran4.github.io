name: GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      # Existing star-count updater, pending consolidation with the Go
      # snapshot workflow in PR #107. No theme, Node or Sass is needed.
      - name: Refresh public star counts (best effort)
        run: python3 scripts/refresh-stars.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build and verify owned-site templates
        run: |
          set -euo pipefail
          export HUGO_CACHEDIR="${RUNNER_TEMP}/hugo_cache"
          mkdir -p "$HUGO_CACHEDIR"
          hugo --minify --templateMetrics
          bash scripts/verify-workbench.sh

      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
