name: GitHub Pages

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public GitHub metadata snapshots
        type: boolean
        default: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh))
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test metadata refresher
        run: go test ./cmd/refresh-github-snapshots
      - name: Refresh validated public metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/refresh-github-snapshots -page-delay=2s
      - name: Check for changed snapshots
        id: changes
        run: |
          set -euo pipefail
          git add -- data/github/repositories.json data/github/starred.json data/stars.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public metadata changes; no commit or rebuild necessary."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Share validated snapshots with build and commit jobs
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-snapshots
          path: |
            data/github/repositories.json
            data/github/starred.json
            data/stars.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: refresh
    if: >-
      ${{ !cancelled() &&
          ((needs.refresh.result == 'skipped' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.refresh)) ||
           (needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Use refreshed snapshots
        if: needs.refresh.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-snapshots
          path: data

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test metadata refresher
        run: go test ./cmd/refresh-github-snapshots

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.8'
          extended: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Everything required
        run: |
          export HUGO_CACHEDIR=${{ runner.temp }}/hugo_cache
          mkdir -p "$HUGO_CACHEDIR"
          hugo mod npm pack
          npm install @popperjs/core@2.11.8 include-media@1.4.10 --save-dev --legacy-peer-deps
          npm install --legacy-peer-deps
          rm -rf public/
          hugo --minify --templateMetrics
          bash scripts/verify-workbench.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ./public

  persist:
    needs: [refresh, build]
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: github-snapshots
          path: data
      - name: Commit verified snapshots directly to main
        run: |
          set -euo pipefail
          git add -- data/github/repositories.json data/github/starred.json data/stars.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: refresh public GitHub metadata snapshots'
          # Never force-push or overwrite a concurrent main update.
          # The GITHUB_TOKEN push does not trigger another workflow; deploy below.
          git push origin HEAD:refs/heads/main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [refresh, build, persist]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          needs.build.result == 'success' &&
          (needs.refresh.result == 'skipped' || needs.persist.result == 'success') }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
