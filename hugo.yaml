baseURL: https://arran4.github.io/
locale: en-US
defaultContentLanguage: en
outputs:
  home: [HTML, RSS, JSON]
enableEmoji: true

pagination:
  pagerSize: 1000
rssLimit: 100

languages:
  en:
    locale: en-US
    label: English
    title: "Arran's GitHub Pages"
    weight: 1

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

taxonomies:
  category: categories
  tag: tags
  star-tag: star-tags
  repo-tag: repo-tags

params:
  gitRepo: https://github.com/arran4/arran4.github.io/
  features:
    pagination:
      maxPostsPerPage: 1000
